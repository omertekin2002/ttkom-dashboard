name: Update Stock Data & Deploy

on:
  schedule:
    # BIST market hours: 10:00–18:00 TRT (UTC+3) = 07:00–15:00 UTC
    # Runs every 15 minutes during market hours, Mon–Fri
    - cron: '*/15 7-15 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: read

# Never run two updates at once: a scheduled and a push-triggered run would
# race on git push. A queued run waits for the running one instead.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch BIST stock data from Yahoo Finance
        run: python3 scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ttkom.json data/tursg.json data/vakbn.json data/halkb.json data/tcell.json
          git diff --staged --quiet || git commit -m "Update BIST stock data"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
