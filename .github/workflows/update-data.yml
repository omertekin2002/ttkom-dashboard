name: Update Stock Data & Deploy

on:
  schedule:
    # BIST market hours: 10:00–18:00 TRT (UTC+3) = 07:00–15:00 UTC
    # Runs every 15 minutes during market hours, Mon–Fri
    - cron: '*/15 7-15 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch BIST stock data from Yahoo Finance
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          stocks = {
              'ttkom': {'symbol': 'TTKOM', 'quote': 'TTKOM.IS'},
              'tursg': {'symbol': 'TURSG', 'quote': 'TURSG.IS'},
          }

          def chart_meta(quote):
              url = f'https://query2.finance.yahoo.com/v8/finance/chart/{quote}?interval=1d&range=5d'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = json.load(response)

              result = raw.get('chart', {}).get('result')
              if not result:
                  raise RuntimeError(f'No Yahoo Finance chart result for {quote}')

              return result[0]['meta']

          def rounded(meta, key):
              value = meta.get(key)
              return round(value, 2) if value is not None else None

          for file_key, stock in stocks.items():
              meta = chart_meta(stock['quote'])
              previous_close = meta.get('chartPreviousClose') or meta.get('previousClose')

              out = {
                  'symbol': stock['symbol'],
                  'exchange': 'BIST',
                  'currency': meta['currency'],
                  'price': round(meta['regularMarketPrice'], 2),
                  'previousClose': round(previous_close, 2),
                  'dayHigh': rounded(meta, 'regularMarketDayHigh'),
                  'dayLow': rounded(meta, 'regularMarketDayLow'),
                  'volume': meta.get('regularMarketVolume'),
                  'updatedAt': datetime.now(timezone.utc).isoformat(),
                  'marketTime': meta.get('regularMarketTime'),
              }

              with open(f'data/{file_key}.json', 'w') as f:
                  json.dump(out, f, indent=2)

              print(f"{stock['symbol']}: {out['price']} TRY (prev close: {out['previousClose']})")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ttkom.json data/tursg.json
          git diff --staged --quiet || git commit -m "Update BIST stock data"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
