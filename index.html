<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTKOM / TURSG / USD/TRY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      background: #1a1a1a;
      color: #ccc;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 400;
      color: #555;
      margin-bottom: 2.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #2a2a2a;
    }

    .section {
      margin-bottom: 2.5rem;
    }

    .ticker {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 0.3rem;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .price {
      font-size: 2rem;
      font-weight: 700;
      color: #e8e8e8;
      letter-spacing: -0.02em;
    }

    .price-usd {
      font-size: 0.95rem;
      color: #666;
    }

    .change {
      font-size: 0.85rem;
      margin-top: 0.2rem;
    }

    .up { color: #4a9; }
    .down { color: #c66; }

    .meta {
      font-size: 0.7rem;
      color: #444;
      margin-top: 0.4rem;
    }

    .loading { color: #333; }

    .sep {
      border: none;
      border-top: 1px solid #222;
      margin: 2rem 0;
    }

    .error { color: #a55; }

    footer {
      font-size: 0.65rem;
      color: #333;
      line-height: 1.7;
      margin-top: 3rem;
      padding-top: 0.5rem;
      border-top: 1px solid #2a2a2a;
    }

    footer a { color: #555; }

    footer button {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.65rem;
      text-decoration: underline;
      padding: 0;
    }

    footer button:hover { color: #999; }
  </style>
</head>
<body>

  <div class="container">
    <h1>ttkom / tursg / usdtry</h1>

    <div class="section" data-stock="ttkom">
      <div class="ticker">TTKOM.IS &mdash; Borsa Istanbul</div>
      <div class="price-row">
        <span class="price loading" data-role="price">---</span>
        <span class="price-usd" data-role="usd"></span>
      </div>
      <div class="change" data-role="change"></div>
      <div class="meta" data-role="updated"></div>
    </div>

    <hr class="sep">

    <div class="section" data-stock="tursg">
      <div class="ticker">TURSG.IS &mdash; Borsa Istanbul</div>
      <div class="price-row">
        <span class="price loading" data-role="price">---</span>
        <span class="price-usd" data-role="usd"></span>
      </div>
      <div class="change" data-role="change"></div>
      <div class="meta" data-role="updated"></div>
    </div>

    <hr class="sep">

    <div class="section">
      <div class="ticker">USD/TRY</div>
      <div class="price-row">
        <span class="price loading" id="fx-rate">---</span>
      </div>
      <div class="change" id="fx-change"></div>
      <div class="meta" id="fx-updated"></div>
    </div>

    <footer>
      bist equities via github actions (every 15m, market hours) · fx via <a href="https://open.er-api.com">open.er-api.com</a><br>
      <button onclick="fetchAll()">refresh</button>
    </footer>
  </div>

  <script>
    const stocks = [
      { key: 'ttkom', file: 'data/ttkom.json', priceTRY: null },
      { key: 'tursg', file: 'data/tursg.json', priceTRY: null },
    ];

    let usdTryRate = null;

    function getStockElements(stock) {
      const root = document.querySelector('[data-stock="' + stock.key + '"]');
      return {
        root,
        priceEl: root.querySelector('[data-role="price"]'),
        usdEl: root.querySelector('[data-role="usd"]'),
        changeEl: root.querySelector('[data-role="change"]'),
        metaEl: root.querySelector('[data-role="updated"]'),
      };
    }

    function updateUsdPrices() {
      stocks.forEach((stock) => {
        const { usdEl } = getStockElements(stock);
        if (stock.priceTRY !== null && usdTryRate !== null) {
          usdEl.textContent = '$' + (stock.priceTRY / usdTryRate).toFixed(2);
        } else {
          usdEl.textContent = '';
        }
      });
    }

    function resetStock(stock) {
      const { priceEl, usdEl, changeEl, metaEl } = getStockElements(stock);

      stock.priceTRY = null;
      priceEl.className = 'price loading';
      priceEl.textContent = '---';
      usdEl.textContent = '';
      changeEl.textContent = '';
      metaEl.textContent = '';
    }

    async function fetchStock(stock) {
      const { priceEl, usdEl, changeEl, metaEl } = getStockElements(stock);
      try {
        const res = await fetch(stock.file);
        if (!res.ok) throw new Error('No data file');
        const d = await res.json();

        const change = d.price - d.previousClose;
        const pct = (change / d.previousClose) * 100;
        const sign = change >= 0 ? '+' : '';
        const dir = change >= 0 ? 'up' : 'down';

        priceEl.className = 'price';
        priceEl.textContent = d.price.toFixed(2);

        stock.priceTRY = d.price;
        updateUsdPrices();

        changeEl.className = 'change ' + dir;
        changeEl.textContent = sign + change.toFixed(2) + ' (' + sign + pct.toFixed(2) + '%)';

        if (d.updatedAt) {
          metaEl.textContent = new Date(d.updatedAt).toLocaleString();
        }
      } catch (e) {
        stock.priceTRY = null;
        priceEl.className = 'price error';
        priceEl.textContent = 'no data';
        usdEl.textContent = '';
        changeEl.textContent = '';
        metaEl.textContent = 'push to github & run the action';
      }
    }

    async function fetchFX() {
      const el = document.getElementById('fx-rate');
      const changeEl = document.getElementById('fx-change');
      const metaEl = document.getElementById('fx-updated');
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const d = await res.json();
        const rate = d.rates.TRY;

        el.className = 'price';
        el.textContent = rate.toFixed(4);

        usdTryRate = rate;
        updateUsdPrices();

        changeEl.className = 'change';
        changeEl.textContent = '1 USD = ' + rate.toFixed(2) + ' TRY';

        metaEl.textContent = new Date(d.time_last_update_utc).toLocaleDateString();
      } catch (e) {
        el.className = 'price';
        el.innerHTML = '<span class="error">failed</span>';
        changeEl.textContent = '';
      }
    }

    function fetchAll() {
      usdTryRate = null;
      stocks.forEach(resetStock);

      document.getElementById('fx-rate').className = 'price loading';
      document.getElementById('fx-rate').textContent = '---';
      document.getElementById('fx-change').textContent = '';
      document.getElementById('fx-updated').textContent = '';

      stocks.forEach(fetchStock);
      fetchFX();
    }

    fetchAll();
  </script>

</body>
</html>
